name: Docker image for automated tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: false
          context: "{{defaultContext}}:scripts/test-server"
          tags: viktorstrate/mactrix-test-server:latest
